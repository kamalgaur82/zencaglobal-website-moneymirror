<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Mirror · Results</title>
<link rel="icon" type="image/png" href="../../assets/zenca-favicon.png?v=1">
<link rel="apple-touch-icon" href="../../assets/zenca-favicon.png?v=1">
<style>
  :root{
    --ink:#000000; --ink-2:#121110; --gold:#C6A15B; --gold-deep:#C6A15B;
    --paper:#F2EFE9; --mute:#8E877B; --line:rgba(198,161,91,.26);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);line-height:1.45;
       padding:26px 18px 34px;max-width:1040px;margin:0 auto}
  .hl{color:var(--gold)} em{font-style:italic}

  header{text-align:center;margin-bottom:18px}
  .mark{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin-top:10px;
     font-size:clamp(18px,5.9vw,33px);line-height:1.1;white-space:nowrap}
  .meta{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.7}
  .meta .date{color:var(--gold-deep)}

  /* CTAs up top, where people actually act */
  .cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 26px}
  a.btn{flex:1 1 220px;max-width:320px;text-decoration:none;text-align:center;padding:13px 16px;
        font-size:15px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.01em}
  a.btn.primary{background:var(--gold);color:var(--ink);font-weight:600}
  a.btn:active{opacity:.85}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .card{border:1px solid var(--line);background:var(--ink-2);padding:14px 15px 13px;break-inside:avoid;
        display:flex;flex-direction:column}
  .cq{font-family:var(--serif);font-size:17px;line-height:1.24;margin-bottom:11px;min-height:2.48em}
  .cbase{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:right;margin-top:auto;padding-top:12px}
  .orow{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;
        padding:8px 11px;margin:5px 0;overflow:hidden;background:rgba(198,161,91,.07)}
  .ofill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(198,161,91,.17);
         transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .orow.win .ofill{background:rgba(198,161,91,.42)}
  .oname{position:relative;z-index:1;font-size:14.5px;color:var(--paper)}
  .oname .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-left:8px}
  .opct{position:relative;z-index:1;font-family:var(--serif);font-size:16px;color:var(--mute);min-width:46px;text-align:right}
  .orow.win .oname{color:var(--paper)} .orow.win .opct{color:var(--gold)}

  .csplit{margin-top:11px;border-top:1px solid rgba(198,161,91,.14);padding-top:9px}
  .csplit-h{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
  .crow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;line-height:1.3}
  .crow .cn{color:var(--paper)} .crow .cv{color:var(--mute);white-space:nowrap}
  .crow .cv b{color:var(--gold);font-weight:500}

  footer{margin-top:26px;font-size:12px;color:var(--mute);text-align:center}
  .empty{border:1px solid var(--line);padding:30px 18px;text-align:center;color:var(--mute);grid-column:1/-1}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    a.btn{flex:1 1 100%;max-width:none}
  }
</style>
</head>
<body>
<header>
  <div class="mark">Zenca · Money Mirror</div>
  <h1>How the room actually thinks</h1>
  <div class="meta" id="meta">Loading the latest results…</div>
</header>

<div class="cta" id="cta" style="display:none">
  <a class="btn primary" id="cta-sub" href="#">Subscribe on Substack</a>
  <a class="btn" id="cta-calc" href="#">FIRE &amp; Price-of-Advice tools</a>
  <a class="btn" id="cta-contact" href="#">Get in touch</a>
</div>

<div class="grid" id="out"><div class="empty">Loading…</div></div>

<footer id="foot"></footer>

<script src="../../assets/zenca-config-live.js?v=25"></script>
<script src="../../assets/zenca-sync-live.js?v=2"></script>
<script>
(function(){
  var CFG = window.ZENCA_CONFIG;
  var sync = window.ZencaSync(CFG.sync);
  var out = document.getElementById("out");
  var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var mk = function(s){ return esc(s).replace(/\*(.+?)\*/g,'<span class="hl">$1</span>').replace(/_(.+?)_/g,'<em>$1</em>'); };
  var pct = function(n,t){ return t ? Math.round(n*100/t) : 0; };

  var deckById = {};
  CFG.deck.forEach(function(s){ if (s.id) deckById[s.id] = s; });

  function totalsFor(sid, partId, counters){
    var by = {}, total = 0, hT = 0, nT = 0;
    Object.keys(counters).forEach(function(k){
      var p = k.split("|");
      if (p[0] !== sid || p[1] !== partId) return;
      var oi = p[2], seg = p[3], v = counters[k];
      by[oi] = by[oi] || { total:0, holder:0, nonholder:0 };
      by[oi].total += v; total += v;
      if (seg === "holder"){ by[oi].holder += v; hT += v; }
      else if (seg === "nonholder"){ by[oi].nonholder += v; nT += v; }
    });
    return { by: by, total: total, hT: hT, nT: nT };
  }

  // one compact card per part (so warm-up age / bitcoin become two cards)
  function cardFor(questionPrompt, part, answerIdx, depth, counters, sid){
    var t = totalsFor(sid, part.id, counters);
    // Always render a box for every question, even with no votes (options show 0%).
    var maxN = 0; part.options.forEach(function(_,i){ var n = (t.by[i]||{}).total||0; if (n>maxN) maxN=n; });
    var rows = part.options.map(function(opt,i){
      var n = (t.by[i]||{}).total || 0, p = pct(n, t.total);
      var win = (n === maxN && n > 0), correct = (answerIdx !== undefined && answerIdx === i);
      return '<div class="orow' + (win?' win':'') + '"><div class="ofill" data-w="' + p + '"></div>' +
               '<div class="oname">' + esc(opt) + (correct?'<span class="tag">correct</span>':'') + '</div>' +
               '<div class="opct">' + p + '%</div></div>';
    }).join("");
    var splitHtml = "";
    if (depth === "split" && (t.hT + t.nT) > 0){
      var sr = part.options.map(function(opt,i){
        var r = t.by[i] || { holder:0, nonholder:0 };
        return '<div class="crow"><span class="cn">' + esc(opt) + '</span>' +
               '<span class="cv">Holds BTC <b>' + pct(r.holder,t.hT) + '%</b> · None <b>' + pct(r.nonholder,t.nT) + '%</b></span></div>';
      }).join("");
      splitHtml = '<div class="csplit"><div class="csplit-h">Split by who holds bitcoin</div>' + sr + '</div>';
    }
    var base = t.total ? (t.total + (t.total === 1 ? ' response' : ' responses')) : 'No responses yet';
    return '<div class="card"><div class="cq">' + mk(questionPrompt) + '</div>' +
           rows + splitHtml + '<div class="cbase">' + base + '</div></div>';
  }

  function render(sess, counters, endIso){
    var man = sess.manifest || {};
    var questions = man.questions || [];
    var start = sess.created_at ? new Date(sess.created_at) : null;
    var end = endIso ? new Date(endIso) : null;

    // "Took part" = votes on the warm-up (first question), the moment the whole
    // room is present. Fall back to the busiest single question if warm-up is empty.
    function peakAcross(qs){
      var m = 0;
      qs.forEach(function(q){ (q.parts || []).forEach(function(p){
        var tt = totalsFor(sess.sid, p.id, counters).total; if (tt > m) m = tt;
      }); });
      return m;
    }
    var tookPart = questions.length ? peakAcross([questions[0]]) : 0;
    if (!tookPart) tookPart = peakAcross(questions);

    var fmtTime = function(dt){ return dt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
    var whenLine = "";
    if (start){
      whenLine = start.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
      var times = fmtTime(start);
      if (end && end.getTime() > start.getTime()) times += " to " + fmtTime(end);
      whenLine += " · " + times;
    }

    document.getElementById("meta").innerHTML =
      'A live, anonymous poll<br>No names, no emails. Just how a room answered.' +
      (whenLine ? '<br><span class="date">' + whenLine + '</span>' : '') +
      (tookPart ? '<br><span class="date">' + tookPart + (tookPart === 1 ? ' response' : ' responses') + '</span>' : '');

    var cards = "";
    questions.forEach(function(q){
      var deckQ = deckById[q.id] || {};
      var parts = q.parts || [];
      var multi = parts.length > 1;
      parts.forEach(function(p){
        // heading: the sub-question prompt for warm-up, else the question prompt
        cards += cardFor(multi ? p.prompt : q.prompt, p, deckQ.answer, q.depth, counters, sess.sid);
      });
    });
    out.innerHTML = cards || '<div class="empty">Results from the most recent Money Mirror will appear here right after a session.</div>';

    requestAnimationFrame(function(){
      document.querySelectorAll('.ofill[data-w]').forEach(function(el){ el.style.width = el.getAttribute('data-w') + '%'; });
    });

    var L = CFG.links || {}, home = "https://zenca.global";
    document.getElementById("cta-sub").href = L.subscribe || home;
    document.getElementById("cta-calc").href = L.calculators || home;
    document.getElementById("cta-contact").href = L.contact || home;
    document.getElementById("cta").style.display = "flex";
    document.getElementById("foot").innerHTML = "Anonymous · aggregate counts only · zenca.global";
  }

  // Session end time: the room state is re-saved on every slide advance, so its
  // last updated_at is the closest proxy for when the session wrapped up.
  function sessionEnd(sid){
    var sb = (CFG.sync && CFG.sync.supabase) || {};
    if (!sb.url || !sb.anonKey) return Promise.resolve(null);
    var u = sb.url + "/rest/v1/zenca_rooms?select=updated_at&sid=eq." + encodeURIComponent(sid);
    return fetch(u, { headers: { apikey: sb.anonKey, Authorization: "Bearer " + sb.anonKey } })
      .then(function(r){ return r.json(); })
      .then(function(rows){ return (rows && rows[0] && rows[0].updated_at) || null; })
      .catch(function(){ return null; });
  }

  function boot(){
    sync.listSessions().then(function(sessions){
      sessions = sessions || [];
      var override = new URLSearchParams(location.search).get("session");
      var target = override ? (sessions.filter(function(s){ return s.sid === override; })[0]) : sessions[0];
      if (!target){ out.innerHTML = '<div class="empty">No Money Mirror sessions recorded yet.</div>'; document.getElementById("cta").style.display = "flex"; return; }
      Promise.all([ sync.allCounters(), sessionEnd(target.sid) ]).then(function(res){
        render(target, res[0] || {}, res[1]);
      });
    }).catch(function(){ out.innerHTML = '<div class="empty">Couldn’t reach the results right now. Please try again in a moment.</div>'; });
  }

  if (sync.ready && sync.ready.then) sync.ready.then(boot); else boot();
})();
</script>
</body>
</html>
